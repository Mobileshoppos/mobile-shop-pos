<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/x-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SadaPos</title>
  </head>
  <body style="margin: 0; background-color: #ffffff;">
    <div id="root">
      <!-- NAYA IZAFA: Instant Premium Native Splash Screen & Loading Animation -->
      <div id="pwa-splash">
        <style>
          #pwa-splash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          }
          @keyframes pwaLogoPulse {
            0% { transform: scale(0.96); opacity: 0.88; }
            50% { transform: scale(1.04); opacity: 1; }
            100% { transform: scale(0.96); opacity: 0.88; }
          }
          .pwa-splash-logo {
            width: 76px;
            height: 76px;
            animation: pwaLogoPulse 1.6s ease-in-out infinite;
          }
          .pwa-splash-title {
            margin-top: 14px;
            font-size: 20px;
            font-weight: 700;
            color: #1f2937;
            letter-spacing: -0.5px;
          }
          .pwa-splash-subtitle {
            margin-top: 3px;
            font-size: 11.5px;
            color: #9ca3af;
            font-weight: 500;
            letter-spacing: 0.2px;
          }
          .pwa-progress-track {
            width: 120px;
            height: 3px;
            background: #f1f5f9;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 22px;
            position: relative;
          }
          .pwa-progress-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: linear-gradient(90deg, #1677ff, #13c2c2);
            border-radius: 3px;
            animation: pwaProgressAnim 1.2s ease-in-out infinite;
          }
          @keyframes pwaProgressAnim {
            0% { left: -50%; }
            100% { left: 100%; }
          }
        </style>
        <img src="/pwa-192x192.png" alt="SadaPOS Logo" class="pwa-splash-logo" />
        <div class="pwa-splash-title">SadaPOS</div>
        <div class="pwa-splash-subtitle">Simple & Fast Retail POS</div>
        <div class="pwa-progress-track">
          <div class="pwa-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
